:root{--nacht:#0a0d12;--papier:#e9dfc9;--papier2:#dfd3b8;--inkt:#2b2620;--inktzwak:#5a5044;--rood:#a83a2b;--roodd:#7e2b20;--goud:#c9a45c;--tekst:#d8d2c4}

body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;

.taal button{background:none;border:1px solid transparent;color:#8d8778;padding:6px 8px;cursor:pointer;font:inherit;letter-spacing:inherit}
.taal button[aria-pressed="true"]{color:var(--goud);border-color:#3a3324}
.reeks{font-family:Georgia,"Times New Roman",serif;letter-spacing:.24em;font-size:11px;color:var(--goud);text-transform:uppercase;margin:0 0 14px;text-align:center}
.map{position:relative;width:100%;max-width:440px;background:linear-gradient(175deg,var(--papier),var(--papier2));color:var(--inkt);

.map:before{content:"";position:absolute;left:26px;top:-13px;width:120px;height:14px;background:var(--papier2);border-radius:4px 4px 0 0;box-shadow:0 1px 0 #fff6 inset}

.teaser{font-size:14.5px;color:var(--inktzwak);margin:0 0 18px}

label{display:block;font-family:"Courier New",monospace;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--inktzwak);margin-bottom:6px}
input{width:100%;font-family:"Courier New",monospace;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--inkt);
  background:#fff7;border:1px solid #9d9072;border-radius:2px;padding:12px 12px;outline-offset:2px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--rood);outline-offset:2px}
.open{margin-top:12px;width:100%;min-height:48px;border:0;border-radius:2px;background:var(--rood);color:#f6eee0;font-family:Georgia,serif;font-size:16.5px;letter-spacing:.06em;cursor:pointer}
.open:hover{background:var(--roodd)}
.open[disabled]{opacity:.6;cursor:progress}
.melding{min-height:1.5em;margin:10px 0 0;font-size:14px;color:var(--roodd)}
.koop{display:block;margin-top:14px;text-align:center;min-height:46px;line-height:44px;border:1px solid var(--inkt);border-radius:2px;color:var(--inkt);text-decoration:none;font-family:Georgia,serif;font-size:15.5px;letter-spacing:.04em}
.koop:hover{background:#0000000f}
.klein{font-size:12.5px;color:var(--inktzwak);margin:12px 0 0;text-align:center}
.terug{margin-top:22px;color:#a39c8c;font-size:14px;text-decoration:none;border-bottom:1px solid #4a4436;padding-bottom:1px}
.terug:hover{color:var(--goud)}
.wacht .map,.wacht .terug,.wacht .taal{display:none}
.bezig{display:none;font-family:Georgia,serif;font-style:italic;color:#a39c8c}
.wacht .bezig{display:block}
