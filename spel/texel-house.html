  [].forEach.call(document.querySelectorAll("[data-t]"),function(e){e.textContent=t[e.getAttribute("data-t")]});
  [].forEach.call(document.querySelectorAll(".taal button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-l")===lang)});
  $("gfMelding").textContent=melding?t[melding]:"";
}
function get(){try{return localStorage.getItem(KEY)||""}catch(e){return""}}
function set(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}
function norm(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"")}
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function ontsleutel(code){
  var S=crypto.subtle,enc=new TextEncoder();
  var basis=await S.importKey("raw",enc.encode(norm(code)),"PBKDF2",false,["deriveKey"]);
  var kek=await S.deriveKey({name:"PBKDF2",salt:b64(P.salt),iterations:P.it,hash:"SHA-256"},basis,{name:"AES-GCM",length:256},false,["decrypt"]);
  var ck=null;
  for(var i=0;i<P.keys.length&&!ck;i++){
    var w=b64(P.keys[i]);
    try{ck=await S.decrypt({name:"AES-GCM",iv:w.subarray(0,12)},kek,w.subarray(12))}catch(e){}
  }
  if(!ck)return null;
  var k=await S.importKey("raw",ck,"AES-GCM",false,["decrypt"]);
  var d=b64(P.data),plat=await S.decrypt({name:"AES-GCM",iv:d.subarray(0,12)},k,d.subarray(12));
  if(P.z)plat=await new Response(new Blob([plat]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return new TextDecoder().decode(plat);
}
async function probeer(code,stil){
  var html=null;
  try{html=await ontsleutel(code)}catch(e){html=null}
  if(html==null)return false;
  set(norm(code));
  try{var u=new URL(location.href);if(u.searchParams.has("code")){u.searchParams.delete("code");history.replaceState(null,"",u.pathname+u.search+u.hash)}}catch(e){}
  document.open();document.write(html);document.close();
  return true;
}
function toon(m){melding=m||null;document.body.classList.remove("wacht");tekst();if(!("ontouchstart" in window))$("gfCode").focus()}
$("gfTitel").textContent=P.title;$("gfTeaser").textContent=P.teaser||"";if(!P.teaser)$("gfTeaser").style.display="none";
$("gfKoop").href=P.kofi;$("gfTerug").href=P.hub;
[].forEach.call(document.querySelectorAll(".taal button"),function(b){b.onclick=function(){lang=b.getAttribute("data-l");tekst()}});
$("gfForm").onsubmit=async function(e){
  e.preventDefault();var k=document.querySelector(".open");k.disabled=true;$("gfMelding").textContent="";
  var ok=await probeer($("gfCode").value);
  if(!ok){k.disabled=false;melding="fout";tekst();$("gfCode").select()}
};
tekst();
(async function(){
  if(!(window.crypto&&crypto.subtle)||(P.z&&typeof DecompressionStream==="undefined")){toon("geen");return}
  var q="";try{q=new URL(location.href).searchParams.get("code")||""}catch(e){}
  var bewaard=get();
  if(q&&await probeer(q))return;
  if(bewaard&&await probeer(bewaard))return;
  if(bewaard&&!q)set("");
  toon(q?"fout":(bewaard?"oud":null));
})();
})();
